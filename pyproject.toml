[project]
name = "cbus-rs232-hass"
version = "0.2.0"
requires-python = ">=3.14.2"
dependencies = ["serialx>=1.15.1"]

[dependency-groups]
dev = ["pytest-homeassistant", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx --cov=custom_components.cbus_rs232 --cov-branch --cov-report=term-missing --cov-fail-under=100"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
